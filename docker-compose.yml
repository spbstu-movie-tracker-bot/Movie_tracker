services:
  app:
    build: .
    container_name: movie-tracker-spring7
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=movietracker
      - DB_USER=movietracker
      - DB_PASSWORD=movietracker
      - RABBITMQ_HOST=rabbitmq
    ports:
      - "8080:8080"
    restart: on-failure

  postgres:
    image: postgres:18
    container_name: movie-tracker-postgres
    environment:
      POSTGRES_DB: movietracker
      POSTGRES_USER: movietracker
      POSTGRES_PASSWORD: movietracker
    volumes:
      - pgdata:/var/lib/postgresql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movietracker -d movietracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: movie-tracker-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
